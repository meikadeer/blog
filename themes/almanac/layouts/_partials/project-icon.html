{{- /* A project's icon, or its first letter on a tone of its name.
       dict: src (an address), title, class (its size and corners) */ -}}
{{- if .src }}
<span class="project-icon {{ .class }}"><img src="{{ .src }}" alt="" loading="lazy" decoding="async" class="size-full object-cover"></span>
{{- else }}
{{- $tone := str.Split " " (printf "%s" (partial "tone.html" .title)) }}
<span class="project-icon project-icon--letter {{ .class }}" aria-hidden="true"
      style="--tone-from: {{ index $tone 0 }}; --tone-to: {{ index $tone 1 }}; --tone-fg: {{ index $tone 2 }};">{{ str.Upper (printf "%.1s" .title) }}</span>
{{- end -}}
